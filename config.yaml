# ============================================================
# SAT Miner — Salad Cloud GPU Config
# ============================================================

private_key: "0xfcc61a25fe0177d4e68b56a3c3117690b602114a2fd381056cd5c0a1ea5273a0"

# SAT Contract / BSC Mainnet
contract_address: "0x14Dc4b4929c664534f1d4D64107d8F36CbF906a0"
chain_id: 56

# --- Gas ---
use_network_gas: true
network_gas_multiplier: 1.0
min_gas_price_gwei: 0.01
max_gas_price_gwei: 5
gas_price_gwei: 0.05
gas_limit: 200000

# --- Solver (CUDA via numba) ---
solver: gpu
gpu_device: "NVIDIA"
gpu_util: 100
gpu_batch_size: 16000000

# --- Relay URLs ---
relay_urls:
  - "https://bsc.rpc.blxrbdn.com"
  - "https://rpc-bsc.48.club"
  - "https://0.48.club"

# --- RPC ---
rpc_url: "https://bsc-dataseed1.binance.org"
rpc_urls:
  - "https://bsc-dataseed1.binance.org"
  - "https://bsc-dataseed2.binance.org"
  - "https://bsc-dataseed3.binance.org"
  - "https://bsc-dataseed4.binance.org"

# --- WebSocket ---
ws_urls:
  - "wss://bsc.drpc.org"
detect_mode: auto
head_ws: "wss://bsc-rpc.publicnode.com"

# --- Options ---
dry_run: false
verbose_logs: false
simulate_before_submit: true
receipt_poll_secs: 3
receipt_timeout_secs: 180
stats_interval_secs: 30
