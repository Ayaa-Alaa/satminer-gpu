# ============================================================
# SAT Miner — Salad Cloud GPU Config (VPS approach)
# Private key passed via PRIVATE_KEY env var, NOT stored here
# ============================================================

# --- SAT Contract / BSC Mainnet ---
contract_address: "0x14Dc4b4929c664534f1d4D64107d8F36CbF906a0"
chain_id: 56

# --- RPC (load balanced, tested live) ---
rpc_urls:
  - "https://bsc-dataseed.binance.org/"
  - "https://bsc-dataseed1.binance.org/"
  - "https://bsc-dataseed2.binance.org/"
  - "https://bsc-dataseed3.binance.org/"
  - "https://bsc-dataseed4.binance.org/"
  - "https://bsc-dataseed1.defibit.io/"
  - "https://bsc-dataseed2.defibit.io/"
  - "https://bsc-dataseed1.ninicoin.io/"
  - "https://bsc.publicnode.com"
  - "https://1rpc.io/bnb"
  - "https://bsc-mainnet.public.blastapi.io"

# --- Solver: GPU ---
gpu_device: "NVIDIA"
gpu_util: 100
gpu_batch_size: 16000000

# --- Gas ---
use_network_gas: true
network_gas_multiplier: 1.0
min_gas_price_gwei: 0.05
max_gas_price_gwei: 5
gas_price_gwei: 0.1
gas_limit: 200000

# --- Submission ---
wait_for_receipt: false
simulate_before_submit: true
simulate_gas_threshold_gwei: 0.1
recheck_challenge_before_send: true
one_submit_per_challenge: true

# --- Challenge detection ---
challenge_check_secs: 6
target_refresh_secs: 60

# --- Dry run: SET TO false AFTER TESTING ---
dry_run: false

# --- Logging ---
auto_restart: true
quiet_logs: true
log_interval: 10
stats_interval_secs: 10
receipt_poll_secs: 3
receipt_timeout_secs: 180

# --- Nonce healing ---
nonce_stuck_threshold: 5
nonce_heal_cooldown_secs: 30
nonce_bump_multiplier: 1.5

# --- Gas gate ---
mine_only_below_gwei: 0
gas_recheck_secs: 15
